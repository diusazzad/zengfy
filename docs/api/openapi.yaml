                  type: integer
                  default: 100
      responses:
        '201':
          description: Subject created successfully

  /organizations/{organization}/school/structure:
    get:
      summary: Get complete academic hierarchy tree for current or specified year
      tags:
        - School ERP - Academic Architecture
      security:
        - BearerAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academic_year_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Complete academic structure tree

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  schemas:
    MetaEnvelope:
      type: object
      properties:
        request_id:
          type: string
          example: "req-9a8f-22b"
        timestamp:
          type: string
          format: date-time
          example: "2026-09-23T07:45:00Z"
        error_code:
          type: string
          nullable: true
          example: "VALIDATION_ERROR"

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation successful"
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: "01921f00-34a1-7b01-8b01-9a8b7c6d5e4f"
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  example: "user@zengfy.test"
            token:
              type: string
              example: "1|NjjqwtR22Y3ojvg48wMC3ZoLObjE4d8hU5xBDrMg1e1d3c6a"
            device:
              type: object
              properties:
                device_name:
                  type: string
                  example: "Chrome Windows"
                last_active_at:
                  type: string
                  format: date-time
        meta:
          $ref: '#/components/schemas/MetaEnvelope'

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          properties:
            user:
              type: object
            active_devices:
              type: array
              items:
                type: object
        meta:
          $ref: '#/components/schemas/MetaEnvelope'

    SimpleSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation successful"
        data:
          type: object
          nullable: true
        meta:
          $ref: '#/components/schemas/MetaEnvelope'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation failed"
        errors:
          type: object
          nullable: true
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
