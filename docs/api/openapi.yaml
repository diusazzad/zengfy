          description: Class details

  /organizations/{organization}/school/classes/{class}/sections:
    post:
      summary: Add a section to a class
      tags:
        - School ERP - Academic Architecture
      security:
        - BearerAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: class
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Section Padma"
                capacity:
                  type: integer
                  default: 40
                  example: 45
                room_number:
                  type: string
                  example: "Room 304"
      responses:
        '201':
          description: Section created successfully

  /organizations/{organization}/school/classes/{class}/subjects:
    post:
      summary: Add a subject to a class
      tags:
        - School ERP - Academic Architecture
      security:
        - BearerAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: class
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Higher Mathematics"
                code:
                  type: string
                  example: "HMATH-101"
                type:
                  type: string
                  enum: [core, elective, optional]
                  default: core
                credits:
                  type: number
                  format: float
                  default: 3.0
                pass_marks:
                  type: integer
