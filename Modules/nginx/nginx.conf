events {
    # Maximum number of simultaneous connections that can be opened by a worker process.
    worker_connections 1024;
}

http {
    # Gzip Compression for Fast Transmission
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2 font/woff;

    # Upstream Laravel Nodes Cluster
    upstream laravel_nodes {
        server app1:8001;
        server app2:8002;
        server app3:8003;
    }

    server {
        listen 80;

        # 1. Service Worker: Must Never Be Cached by Browser
        location = /sw.js {
            proxy_pass http://laravel_nodes;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 7000;

            add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        # 2. Immutable Long-Term Browser Cache for Static Assets (1 Year)
        location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
            proxy_pass http://laravel_nodes;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 7000;

            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status "HIT-STATIC-CACHE" always;
        }

        # 3. Dynamic App Traffic & HTML Navigation
        location / {
            proxy_pass http://laravel_nodes;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 7000;
        }
    }
}
