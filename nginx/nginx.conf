events {
    # Maximum number of simultaneous connections that can be opened by a worker process.
    worker_connections 1024;
}

http {
    # The 'upstream' block defines a cluster of servers (our Laravel apps).
    # Think of this as a team of 3 Chefs in a restaurant kitchen.
    upstream laravel_nodes {
        # 'app1', 'app2', 'app3' are the container names from docker-compose.yml
        server app1:8001;
        server app2:8002;
        server app3:8003;
    }

    server {
        # Nginx acts as the Host/Manager standing at the front door (Port 80 inside the container, mapped to 7000 outside).
        listen 80;

        location / {
            # Distribute incoming requests to the 'laravel_nodes' cluster using Round-Robin (default).
            # If Customer 1 comes -> goes to app1
            # If Customer 2 comes -> goes to app2
            proxy_pass http://laravel_nodes;
            
            # Pass original client host and port (e.g. localhost:7000 or zengfy.test:7000)
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 7000;
        }
    }
}