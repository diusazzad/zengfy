name: SSH Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Build Composer Locally
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Build Frontend (Optional)
        run: |
          npm install --force || true
          npm run build || true

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
          --exclude=".git" \
          --exclude=".github" \
          --exclude="node_modules" \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/sfxglllk/public_html/

      - name: Run Laravel Commands on Server
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          cd /home/sfxglllk/public_html &&
          php artisan optimize:clear &&
          php artisan migrate --force &&
          php artisan optimize &&
          php artisan storage:link
          "
