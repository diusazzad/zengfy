services:
  # Nginx Load Balancer
  proxy:
    image: nginx:alpine
    ports:
      - "7000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

  # Laravel Node 1
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - APP_PORT=8001
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=zengfy_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=database
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=database
    depends_on:
      - mysql
      - redis

  # Laravel Node 2
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - APP_PORT=8002
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=zengfy_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=database
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=database
    depends_on:
      - mysql
      - redis

  # Laravel Node 3
  app3:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - APP_PORT=8003
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=zengfy_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=database
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=database
    depends_on:
      - mysql
      - redis

  # MySQL Database
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zengfy_db
    ports:
      - "3307:3306"

  # Redis for Cache & Queues
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # Visual Database Management GUI
  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
