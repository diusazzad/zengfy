version: '3.8'

services:
  # Nginx Load Balancer
  proxy:
    image: nginx:alpine
    ports:
      - "7000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

  # Laravel Node 1
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - APP_PORT=8001

  # Laravel Node 2
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - APP_PORT=8002

  # Laravel Node 3
  app3:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - APP_PORT=8003

  # MySQL Database
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zengfy_db
    ports:
      - "3306:3306"

  # Redis for Cache & Queues
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
